<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>전인고 시험 족보</title>

    <!-- 디자인 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 상단 -->
    <header>

        <div class="container">

            <div class="logo">
                JEONIN HIGH SCHOOL
            </div>

            <h1>
                전인고 시험 족보
            </h1>

            <p>
                전인고 학생들을 위한 시험 자료 아카이브
            </p>

            <!-- 검색 -->
            <div class="search-box">

                <input
                    type="text"
                    placeholder="시험, 과목, 연도 등을 검색해 보세요"
                >

            </div>

        </div>

    </header>


    <!-- 본문 -->
    <main>

        <div class="container">

            <!-- 학년 선택 -->

            <div class="grade-buttons">

                <button>
                    전체
                </button>

                <button>
                    1학년
                </button>

                <button>
                    2학년
                </button>

                <button>
                    3학년
                </button>

            </div>


            <!-- 시험 자료 -->

            <div class="section-title">

                <h2>
                    최근 시험 자료
                </h2>

                <p>
                    현재 등록된 시험 자료입니다.
                </p>

            </div>


            <div class="exam-list">


                <!-- 시험 1 -->

                <div class="exam-card">

                    <div class="exam-info">
                        2026학년도 · 3학년 · 1학기 중간고사
                    </div>

                    <h3>
                        국어
                    </h3>

                    <div class="file-buttons">

                        <a href="#">
                            시험지
                        </a>

                        <a href="#">
                            정답
                        </a>

                        <a href="#">
                            해설
                        </a>

                    </div>

                </div>


                <!-- 시험 2 -->

                <div class="exam-card">

                    <div class="exam-info">
                        2026학년도 · 2학년 · 1학기 중간고사
                    </div>

                    <h3>
                        영어
                    </h3>

                    <div class="file-buttons">

                        <a href="#">
                            시험지
                        </a>

                        <a href="#">
                            정답
                        </a>

                    </div>

                </div>


                <!-- 시험 3 -->

                <div class="exam-card">

                    <div class="exam-info">
                        2026학년도 · 1학년 · 1학기 중간고사
                    </div>

                    <h3>
                        수학
                    </h3>

                    <div class="file-buttons">

                        <a href="#">
                            시험지
                        </a>

                        <a href="#">
                            정답
                        </a>

                    </div>

                </div>


            </div>

        </div>

    </main>


    <!-- 하단 -->

    <footer>

        <div class="container">

            전인고 시험 족보

        </div>

    </footer>

<script src="app.js"></script>
    
</body>

</html>
