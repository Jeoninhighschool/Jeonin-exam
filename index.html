<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>전인고 시험 족보</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- 상단 -->

    <header>

        <div class="container">

            <div class="logo">
                JEONIN HIGH SCHOOL
            </div>


            <h1>
                전인고 시험 족보
            </h1>


            <p>
                전인고 학생들을 위한 시험 자료 아카이브
            </p>


            <!-- 검색창 -->

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="시험, 과목, 연도 등을 검색해 보세요"
                >

            </div>

        </div>

    </header>



    <!-- 본문 -->

    <main>

        <div class="container">


            <!-- 학년 버튼 -->

            <div class="grade-buttons">

                <button data-grade="전체">
                    전체
                </button>

                <button data-grade="1학년">
                    1학년
                </button>

                <button data-grade="2학년">
                    2학년
                </button>

                <button data-grade="3학년">
                    3학년
                </button>

            </div>



            <!-- 시험 자료 -->

            <div class="section-title">

                <h2>
                    시험 자료
                </h2>

                <p id="resultText">
                    등록된 시험 자료입니다.
                </p>

            </div>



            <!-- 시험 카드가 들어가는 곳 -->

            <div
                class="exam-list"
                id="examList"
            ></div>


        </div>

    </main>



    <!-- 하단 -->

    <footer>

        <div class="container">

            전인고 시험 족보

        </div>

    </footer>



    <!-- JavaScript -->

    <script src="app.js"></script>


</body>

</html>
